<div class="px-6 py-6 space-y-5">

  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h2 class="text-base font-bold text-gray-900">Firmas del Proyecto</h2>
      <p class="text-xs text-gray-400 mt-0.5">Quién elabora y quién aprueba el documento</p>
    </div>
    @if (saveMsg()) {
      <span class="text-xs font-medium text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg">{{ saveMsg() }}</span>
    }
  </div>

  @if (error()) {
    <p class="text-xs font-semibold text-danger bg-danger/5 border border-danger/20 rounded-lg px-3 py-2">{{ error() }}</p>
  }

  @if (loading()) {
    <div class="flex items-center justify-center h-40">
      <div class="w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
    </div>
  } @else {

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

      <!-- ── Elabora ──────────────────────────────────────────────────────── -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 space-y-4">
        <h3 class="text-sm font-bold text-primary-700">Elabora</h3>

        <div>
          <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Nombre</label>
          <input type="text" [(ngModel)]="prepared.name" placeholder="Nombre de quien elabora" [disabled]="locked"
            class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 placeholder-neutral-300 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Cargo</label>
            <input type="text" [(ngModel)]="prepared.position" placeholder="Cargo" [disabled]="locked"
              class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 placeholder-neutral-300 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Fecha</label>
            <input type="date" [(ngModel)]="prepared.date" [disabled]="locked"
              class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Firma</label>
          @if (preparedImageUrl()) {
            <div class="border border-neutral-200 rounded-xl p-3 flex items-center gap-3">
              <img [src]="preparedImageUrl()" alt="Firma de quien elabora" class="h-16 object-contain"/>
              <label class="ml-auto text-xs font-medium text-accent hover:text-accent-700 cursor-pointer">
                Reemplazar
                <input type="file" accept="image/*" class="hidden" [disabled]="locked || preparedUploading()" (change)="onImageSelected('prepared', $event)"/>
              </label>
            </div>
          } @else {
            <label class="flex flex-col items-center justify-center gap-1.5 border border-dashed border-neutral-300 rounded-xl py-6 cursor-pointer hover:bg-neutral-50 transition-colors">
              <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <span class="text-xs text-neutral-400">{{ preparedUploading() ? 'Subiendo...' : 'Subir imagen de la firma' }}</span>
              <input type="file" accept="image/*" class="hidden" [disabled]="locked || preparedUploading()" (change)="onImageSelected('prepared', $event)"/>
            </label>
          }
        </div>
      </div>

      <!-- ── Aprueba ──────────────────────────────────────────────────────── -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5 space-y-4">
        <h3 class="text-sm font-bold text-primary-700">Aprueba</h3>

        <div>
          <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Nombre</label>
          <input type="text" [(ngModel)]="approved.name" placeholder="Nombre de quien aprueba" [disabled]="locked"
            class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 placeholder-neutral-300 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Cargo</label>
            <input type="text" [(ngModel)]="approved.position" placeholder="Cargo" [disabled]="locked"
              class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 placeholder-neutral-300 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Fecha</label>
            <input type="date" [(ngModel)]="approved.date" [disabled]="locked"
              class="w-full px-3 py-2 rounded-xl border border-neutral-200 text-sm text-primary-700 bg-neutral-50 focus:bg-surface outline-none focus:ring-2 focus:ring-accent-200 focus:border-accent transition-colors"/>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-neutral-500 uppercase tracking-wide mb-1.5">Firma</label>
          @if (approvedImageUrl()) {
            <div class="border border-neutral-200 rounded-xl p-3 flex items-center gap-3">
              <img [src]="approvedImageUrl()" alt="Firma de quien aprueba" class="h-16 object-contain"/>
              <label class="ml-auto text-xs font-medium text-accent hover:text-accent-700 cursor-pointer">
                Reemplazar
                <input type="file" accept="image/*" class="hidden" [disabled]="locked || approvedUploading()" (change)="onImageSelected('approved', $event)"/>
              </label>
            </div>
          } @else {
            <label class="flex flex-col items-center justify-center gap-1.5 border border-dashed border-neutral-300 rounded-xl py-6 cursor-pointer hover:bg-neutral-50 transition-colors">
              <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
              </svg>
              <span class="text-xs text-neutral-400">{{ approvedUploading() ? 'Subiendo...' : 'Subir imagen de la firma' }}</span>
              <input type="file" accept="image/*" class="hidden" [disabled]="locked || approvedUploading()" (change)="onImageSelected('approved', $event)"/>
            </label>
          }
        </div>
      </div>

    </div>

    <div class="flex items-center gap-2">
      <button type="button" (click)="save()" [disabled]="locked || saving()"
        class="flex items-center gap-1.5 px-5 py-2.5 bg-gradient-to-r from-accent to-accent-700 hover:from-accent-600 hover:to-accent-800 text-white text-sm font-semibold rounded-xl shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        @if (saving()) { Guardando... } @else { Guardar firmas }
      </button>
    </div>

  }

</div>
