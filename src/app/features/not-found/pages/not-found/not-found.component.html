<!-- 404 — PMO Platform -->
<div class="login-bg">

  <div class="deco-green"></div>

  <div class="login-card not-found-card">

    <div class="form-col items-center text-center">

      <img
        src="assets/fodc.webp"
        alt="Plataforma PMO - Gestión de proyectos"
        class="not-found-logo"
        onerror="this.style.display='none'"
      />

      <p class="not-found-code">404</p>

      <h1 class="text-2xl font-semibold text-neutral-900 mb-2">Página no encontrada</h1>
      <p class="text-sm text-neutral-500 mb-8 max-w-sm">
        La página que buscas no existe o fue movida. Verifica el enlace o vuelve al inicio.
      </p>

      <a [routerLink]="homeUrl" class="btn-primary py-3 px-8 rounded-xl font-semibold text-sm tracking-wide text-white inline-block">
        Volver al inicio
      </a>

      <p class="text-center text-xs text-neutral-400 mt-10">
        © {{ currentYear }} Plataforma PMO · Todos los derechos reservados
      </p>
    </div>

  </div>
</div>
