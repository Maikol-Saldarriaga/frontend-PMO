<header class="topbar">

  <!-- Lado izquierdo -->
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="toggleSidebar.emit()" aria-label="Menú">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h2 class="topbar__title">{{ pageTitle }}</h2>
  </div>

  <!-- Lado derecho -->
  <div class="topbar__right">

    <!-- Notificaciones — Flowbite Dropdown -->
    <div class="relative">
      <button
        id="notif-btn"
        data-dropdown-toggle="notif-dropdown"
        data-dropdown-placement="bottom-end"
        class="topbar__icon-btn"
        type="button"
        aria-label="Notificaciones">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="topbar__badge" *ngIf="notificationStore.unreadCount() > 0">{{ notificationStore.unreadCount() }}</span>
      </button>

      <!-- Dropdown notificaciones -->
      <div id="notif-dropdown" appPortalToBody
           class="z-[9999] hidden w-80 bg-white divide-y divide-neutral-100 rounded-xl shadow-lg border border-neutral-200">
        <div class="px-4 py-3 flex items-center justify-between">
          <span class="text-sm font-semibold text-primary-800">Notificaciones</span>
          <span class="notif-count" *ngIf="notificationStore.unreadCount() > 0">{{ notificationStore.unreadCount() }} nuevas</span>
        </div>
        <ul class="divide-y divide-neutral-100 max-h-80 overflow-y-auto">
          <li *ngFor="let n of notificationStore.notifications()" class="notif-item" style="cursor:pointer" (click)="onNotificationClick(n)">
            <div class="notif-dot" [class.notif-dot--accent]="n.type === 'hito_cumplido'" [class.notif-dot--warning]="n.type === 'riesgo_registrado'" [class.notif-dot--read]="n.is_read"></div>
            <div>
              <p class="notif-item__text" [class.notif-item__text--read]="n.is_read">
                <b>{{ n.title }}</b><br>{{ n.message }}
              </p>
              <p class="notif-item__time">{{ timeAgo(n.created_at) }}</p>
            </div>
          </li>
          <li *ngIf="!notificationStore.notifications().length" class="px-4 py-6 text-center text-xs text-neutral-400">
            Sin notificaciones por ahora.
          </li>
        </ul>
        <div class="px-4 py-2.5" *ngIf="notificationStore.notifications().length">
          <button type="button" (click)="markAllRead()" class="text-xs font-medium text-primary-700 hover:underline">Marcar todas como leídas</button>
        </div>
      </div>
    </div>

    <div class="topbar__divider"></div>

    <!-- Avatar + Dropdown usuario — Flowbite -->
    <div class="relative">
      <button
        id="user-btn"
        data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom-end"
        class="topbar__user"
        type="button">

        <!-- Avatar: imagen base64 o iniciales -->
        <div class="topbar__avatar">
          <img *ngIf="avatarUrl" [src]="avatarUrl" alt="avatar" class="w-full h-full object-cover rounded-full" (error)="onAvatarError()"/>
          <span *ngIf="!avatarUrl">{{ initials }}</span>
        </div>

        <div class="topbar__user-info">
          <span class="topbar__user-name">{{ user?.name }}</span>
          <span class="topbar__user-role">{{ user?.role }}</span>
        </div>
        <svg class="w-4 h-4 ml-1 text-neutral-400 hidden sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>

      <!-- Dropdown usuario -->
      <div id="user-dropdown" appPortalToBody
           class="z-[9999] hidden w-52 bg-white divide-y divide-neutral-100 rounded-xl shadow-lg border border-neutral-200">
        <div class="px-4 py-3">
          <p class="text-sm font-semibold text-neutral-900">{{ user?.name }}</p>
          <p class="text-xs text-neutral-500 truncate">{{ user?.email }}</p>
        </div>
        <div class="py-1">
          <button (click)="logout()" class="user-menu-item user-menu-item--danger w-full text-left">
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>

  </div>
</header>
